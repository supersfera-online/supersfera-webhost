name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.22 is the oldest supported version (README); stable is the newest.
        go: ['1.22.x', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Vet
        run: go vet main.go main_test.go
      - name: Test
        run: go test -race -count=1 main.go main_test.go

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build for every supported platform
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64 freebsd/amd64; do
            echo "build $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -o /dev/null main.go
          done
